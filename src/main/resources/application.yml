quarkus:
  hibernate-orm:
    mapping:
      format:
        global: ignore
  rest:
    path: /api
  smallrye-openapi:
    store-schema-directory: build/openapi
  cache:
    caffeine:
      user-permissions:
        expire-after-write: PT5M
        maximum-size: 10000
  datasource:
    db-kind: postgresql
  # OIDC web-app configuration. Provider settings (auth-server-url, client-id, secret) are configured per environment.
  oidc:
    # Authorization code flow with session cookie for browser-based login.
    application-type: web-app
    authentication:
      # Additional scopes required to populate user profile and email claims.
      scopes:
        - profile
        - email
      # Must match the redirect URI registered in the OAuth application.
      redirect-path: /auth/callback
      restore-path-after-redirect: true
  s3:
    # Dev Services starts LocalStack unless endpoint-override is set; create the default work bucket.
    devservices:
      buckets:
        - prts-artifacts
  http:
    auth:
      permission:
        oauth2_auth:
          paths:
            - "/api/*"
          policy: "authenticated"
        # Only the worker WebSocket uses the shared secret; API endpoints require standard authentication.
        worker_ws:
          paths:
            - "/ws/worker"
          policy: "authenticated"
          auth-mechanism:
            - "worker-token"


"%dev":
  quarkus:
    datasource:
      # Fixed port and credentials for local PostgreSQL access via Dev Services.
      devservices:
        port: 5432
        db-name: prts
        username: prts
        password: prts
        # Set reuse: true (and testcontainers.reuse.enable=true) to keep data across restarts.
    # Disable OIDC in dev mode; DevAuthMechanism provides automatic admin authentication.
    oidc:
      enabled: false
    hibernate-orm:
      schema-management:
        strategy: update
  # Secret for worker authentication in dev/test. Must be configured explicitly in production.
  worker:
    secret: "allo"
  # Encryption keys for secrets in dev. Production keys must be configured via environment.
  secret:
    active-key: v1
    keys:
      v1: "pyyrg0gJ06CIW+ryutiDTJCNStt4b/kg/mKLkRnsb/o="

# Configuration for @QuarkusTest (E2E tests using Dev Services).
"%test":
  quarkus:
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
    # Disable OIDC in tests; authentication uses personal access tokens.
    oidc:
      enabled: false
  worker:
    secret: "test-worker-secret"
  secret:
    active-key: v1
    keys:
      v1: "bWD/ecNZjAl4DWA6IGn8oB6DH8jpM508NP5zhzwTC/A="
  job:
    pending:
      # Disable automatic dispatcher ticks; ticks are driven manually in tests.
      interval: PT24H

"%prod":
  quarkus:
    datasource:
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL}
storage:
  presign-duration: PT15M
  bucket: prts-artifacts
  max-file-size: 512M
  max-job-size: 4G

admin:
  list:
    max-page-size: 50

permission:
  # Permissions taken out of service system-wide, refused to everyone including admin:all holders.
  # An unknown name, or admin:all itself, fails startup. Takes a restart to change.
  banned: [ ]

job:
  log:
    max-page-size: 20
  list:
    max-page-size: 50
  pending:
    interval: PT1S
    # How long an entry keeps the authorization it was accepted with.
    ttl: PT1H
    max-per-project: 100
    backoff: PT2S
    max-backoff: PT30S
    batch: 20
