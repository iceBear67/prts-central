plugins {
    id 'java'
    id 'io.quarkus'
    id 'io.freefair.lombok' version '9.5.0'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'io.quarkiverse.amazonservices:quarkus-amazon-s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation enforcedPlatform("${quarkusPlatformGroupId}:quarkus-amazon-services-bom:${quarkusPlatformVersion}")
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation("io.quarkus:quarkus-smallrye-openapi")
    implementation 'io.quarkus:quarkus-hibernate-orm-rest-data-panache'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
//    implementation 'io.quarkus:quarkus-flyway'
    // Flyway 10+ ships database support as separate modules.
//    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-cache'
    implementation 'io.quarkus:quarkus-hibernate-orm'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
    // Provides Mockito support for Quarkus tests, including static mocking.
    testImplementation 'io.quarkus:quarkus-junit-mockito'
    implementation("io.quarkus:quarkus-websockets-next")
}

group = 'io.ib67'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// Enable E2E tests when running the e2eTest task or when passing -Pe2e.
// Checks startParameter so this can be evaluated at configuration time.
def e2eRequested = project.hasProperty('e2e') ||
        gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'e2eTest' }

test {
    useJUnitPlatform {
        if (!e2eRequested) {
            excludeTags 'e2e'
        }
    }
    if (!e2eRequested) {
        // Exclude E2E test classes during standard test runs to prevent
        // Quarkus from starting Dev Services containers prematurely.
        exclude '**/*E2ETest*'
    }
}

// Runs all tests including container-based E2E tests.
tasks.register('e2eTest') {
    group = 'verification'
    description = 'Runs all tests including container-based E2E tests.'
    dependsOn tasks.named('test')
}
