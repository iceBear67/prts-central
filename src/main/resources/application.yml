quarkus:
  hibernate-orm:
    mapping:
      format:
        global: ignore
  rest:
    path: /api
  smallrye-openapi:
    store-schema-directory: build/openapi
  cache:
    caffeine:
      user-permissions:
        expire-after-write: PT5M
        maximum-size: 10000
  datasource:
    db-kind: postgresql
  s3:
    # Dev Services starts LocalStack unless endpoint-override is set; create the default work bucket.
    devservices:
      buckets:
        - prts-artifacts
  http:
    auth:
      permission:
        oauth2_auth:
          paths:
            - "/api/*"
          policy: "authenticated"
        # Only the socket takes the shared secret; /api/worker/* is an admin's, authenticated like
        # the rest of the API.
        worker_ws:
          paths:
            - "/ws/worker"
          policy: "authenticated"
          auth-mechanism:
            - "worker-token"


"%dev":
  quarkus:
    datasource:
      # No jdbc.url on purpose — a URL is exactly what stops Dev Services from starting a container, and
      # here it should start one. Everything below is pinned only so `psql -h localhost -U prts prts`
      # keeps working; without it the port is random and the credentials are Quarkus' defaults.
      devservices:
        port: 5432
        db-name: prts
        username: prts
        password: prts
        # The container dies with the dev process, so `update` below always meets an empty schema. To
        # keep data across restarts instead: `reuse: true` here plus `testcontainers.reuse.enable=true`
        # in ~/.testcontainers.properties.
    # No provider in dev: DevAuthMechanism logs uncredentialed requests in as the DevAdminSeeder admin,
    # and a PAT exercises the real chain. Left enabled it would find no auth-server-url and Dev Services
    # would pull a Keycloak container.
    oidc:
      enabled: false
    hibernate-orm:
      schema-management:
        strategy: update
  # Dev only, deliberately: outside %dev the property has no default, so a deployment that forgets to
  # set worker.secret fails to start rather than accepting a token from the repository.
  worker:
    secret: "allo"
  # Same reason. Rotating means adding a key here (`python scripts/secrets.py genkey`), pointing
  # active-key at it and running `python scripts/secrets.py rotate` offline; the old key may only be
  # dropped once that reports nothing left, since each row names the key it is sealed under.
  secret:
    active-key: v1
    keys:
      v1: "pyyrg0gJ06CIW+ryutiDTJCNStt4b/kg/mKLkRnsb/o="

# Tiers A and B never read this file. Everything here exists so a @QuarkusTest can boot; Postgres and
# LocalStack come from Dev Services, so nothing is pinned and nothing is started by hand. See
# agent-docs/testing.md.
"%test":
  quarkus:
    # Neither the datasource nor S3 is configured here: a URL or an endpoint-override would be read as
    # "something is already running", and Dev Services would then start nothing.
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
    # No profile configures an auth-server-url any more, so the extension would fail startup. Tests
    # authenticate with a personal access token; dev's auto-login is @IfBuildProfile("dev") and so is
    # not built here, which is what keeps the permission matrix from passing as an admin.
    oidc:
      enabled: false
    # user-permissions caches grants for 5 minutes, so a grant made mid-test would not be observed.
    cache:
      enabled: false
  worker:
    secret: "test-worker-secret"
  secret:
    active-key: v1
    keys:
      v1: "bWD/ecNZjAl4DWA6IGn8oB6DH8jpM508NP5zhzwTC/A="
  job:
    pending:
      # Frozen: the dispatcher must not tick on its own during a test. Drive tick() by hand.
      interval: PT24H

"%prod":
  quarkus:
    datasource:
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL}
storage:
  presign-duration: PT15M
  bucket: prts-artifacts
  max-file-size: 512M
  max-job-size: 4G

job:
  log:
    max-page-size: 20
  list:
    max-page-size: 50
  pending:
    interval: PT1S
    # How long an entry keeps the authorization it was accepted with.
    ttl: PT1H
    max-per-project: 100
    backoff: PT2S
    max-backoff: PT30S
    batch: 20
