quarkus:
  hibernate-orm:
    mapping:
      format:
        global: ignore
  rest:
    path: /api
  smallrye-openapi:
    store-schema-directory: build/openapi
  cache:
    caffeine:
      user-permissions:
        expire-after-write: PT5M
        maximum-size: 10000
  datasource:
    db-kind: postgresql
    # No jdbc.url in dev/test on purpose: Dev Services starts a throwaway PostgreSQL container.
    jdbc:
      url: "jdbc:postgresql://localhost:5432/?user=postgres&password=12345aa"
  s3:
    # Dev Services starts LocalStack unless endpoint-override is set; create the default work bucket.
    devservices:
      buckets:
        - prts-artifacts
  http:
    auth:
      permission:
        oauth2_auth:
          paths:
            - "/api/*"
          policy: "authenticated"
        worker_ws:
          paths:
            - "/ws/worker"
            - "/api/worker/*"
          policy: "authenticated"
          auth-mechanism:
            - "worker-token"


"%dev":
  quarkus:
    oidc:
      # The issuer base URL, not the authorization endpoint: Quarkus discovers the endpoints from
      # <auth-server-url>/.well-known/openid-configuration.
      auth-server-url: "https://git.sfclub.cc"
      client-id: "df2b6625-6b4f-4c1a-829d-41e6861deb14"
      credentials:
          secret: "gto_5n2mulz7xzm5ylrgbczekgx2f3dup7xdjz2jmgudnseokmvhlhra"
      # Server-side authorization code flow with a session cookie.
      application-type: web-app
      authentication:
        # openid is always requested; these two populate the name/email claims that
        # OidcUserProvisioner needs to register a new user.
        scopes:
          - profile
          - email
        # Must match the redirect URI registered on the Gitea OAuth application exactly.
        redirect-path: /auth/callback
        # Send the user back to the page they originally requested after login.
        restore-path-after-redirect: true
    hibernate-orm:
      schema-management:
        strategy: update
  # Dev only, deliberately: outside %dev the property has no default, so a deployment that forgets to
  # set worker.secret fails to start rather than accepting a token from the repository.
  worker:
    secret: "allo"
  # Same reason. Rotating means adding a key here (`python scripts/secrets.py genkey`), pointing
  # active-key at it and running `python scripts/secrets.py rotate` offline; the old key may only be
  # dropped once that reports nothing left, since each row names the key it is sealed under.
  secret:
    active-key: v1
    keys:
      v1: "pyyrg0gJ06CIW+ryutiDTJCNStt4b/kg/mKLkRnsb/o="

"%prod":
  quarkus:
    datasource:
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL}
storage:
  presign-duration: PT15M
  bucket: prts-artifacts
  max-file-size: 512M
  max-job-size: 4G

job:
  log:
    max-page-size: 20
