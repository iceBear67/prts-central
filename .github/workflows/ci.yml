name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs to save CI runner resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Set up Java 21 for Gradle and test execution.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Run all tests, including container-based E2E tests using Quarkus Dev Services.
      - run: ./gradlew e2eTest --console=plain --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
