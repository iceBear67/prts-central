pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}
rootProject.name = 'prts-central'

// A standalone worker implementation used by the e2e tests. It speaks the protocol on the wire and
// deliberately compiles against nothing from :prts-central, like the real workers do.
include 'worker-mock'
